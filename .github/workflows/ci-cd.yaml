name: Express TypeScript CI/CD

on:
  push:
    branches: [amitav]
  pull_request:
    branches: [amitav]

jobs:
  ci-check:
    name: Install & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci-check
    if: github.ref == 'refs/heads/amitav'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fahadpervej-mditems-app:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /home/${{ secrets.VPS_USER }}/server
            cd /home/${{ secrets.VPS_USER }}/server

            # Copy docker-compose.yaml & Dockerfile from GitHub
            curl -O https://raw.githubusercontent.com/Softvence-Omega-Cyber-Monk/fahad-pervej-backend/amitav/docker-compose.yaml
            curl -O https://raw.githubusercontent.com/Softvence-Omega-Cyber-Monk/fahad-pervej-backend/amitav/Dockerfile

            # Login to Docker Hub
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull the correct image
            sudo docker pull amitavrchy/fahadpervej-mditems-app:latest

            # Build + start containers (ensure docker-compose.yaml matches the image name)
            sudo docker compose pull
            sudo docker compose up -d
