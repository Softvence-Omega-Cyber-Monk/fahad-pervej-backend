# Name this (It can be anything)
name: CI/CD For test and deployment

on: 
    push: #trigger when push happens
        branches:   #trigger when push code into main branch. it can be array, wildcard or single
            - "**"
jobs:   #ki ki kaj hobe seta
    test:     #test the code
        name: Test Machine
        runs-on: ubuntu-latest

        steps: 
            - name: Code checkout on machine
              uses: actions/checkout@v3

            - name: Setup Nodejs
              uses: actions/setup-node@v3
              with:
                node-version: 24 

            - name: Install Dependencies
              run: npm install

            - name: Build Application
              run: npm run build
    build-push:
        name: Build and Push Image
        runs-on: ubuntu-latest

        steps:
          - name: Checkout
            uses: actions/checkout@v3
          
          - name: login to dockerhub
            uses: docker/login-action@v3
            with:
                  username: ${{secrets.DOCKER_USERNAME}} 
                  password: ${{secrets.DOCKER_PASSWORD}}
          - name: Setup Docker
            uses: docker/setup-docker-action@v4

          - name: build image
            run: docker build --no-cache -t ${{secrets.DOCKER_USERNAME}}/${{secrets.PACKAGE}}:latest .
          
          - name: push image
            run: docker push ${{secrets.DOCKER_USERNAME}}/${{secrets.PACKAGE}}:latest

    deploy:
        name: deploy to vps
        runs-on: ubuntu-latest
        
        steps: 
          - name: Test SSH connection to VPS
            uses: appleboy/ssh-action@v1.0.3
            with: 
              host: ${{secrets.HOST}}
              username: ${{secrets.USERNAME}}
              key: ${{secrets.VPS_SSH_KEY}}
              script: echo "Successfully connected to VPS" uptime
          
          - name: Copy compose file
            uses: appleboy/scp-action@v0.1.7
            with: 
              host: ${{secrets.HOST}}
              username: ${{secrets.USERNAME}}
              key: ${{secrets.VPS_SSH_KEY}}
              source: "docker-compose.yaml"
              target: "~/projects/${{secrets.PACKAGE}}" 

          - name: Deploy to VPS
            uses: appleboy/ssh-action@v1.0.3
            with: 
              host: ${{secrets.HOST}}
              username: ${{secrets.USERNAME}}
              key: ${{secrets.VPS_SSH_KEY}}
              script: |
                  cd "~/projects/${{secrets.PACKAGE}}"
                  docker compose pull 
                  docker compose down
                  docker image prune -af
                  docker compose up -d --force-recreate

          - name: Restart Caddy Server
            uses: appleboy/ssh-action@v1.0.3
            with: 
              host: ${{secrets.HOST}}
              username: ${{secrets.USERNAME}}
              key: ${{secrets.VPS_SSH_KEY}}
              script: |
                  sudo systemctl restart caddy
                  echo "Successfully Restarted Caddy Server"

          



