version: "3.9"

services:
  app:
    image: amitavrchy/fahadpervej-mditems-app:latest   # Use GitHub Docker Hub image
    container_name: fahadpervej-mditems-app
    restart: unless-stopped
    ports:
      - "5056:5056"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
